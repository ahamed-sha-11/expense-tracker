[project]
name = "expense-tracker"
version = "0.1.0"
description = "Expense tracker API built with FastAPI and SQLAlchemy"
readme = "README.md"
authors = [
    { name = "ahamed sha", email = "iahamedsha@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "fastapi==0.143.1",
    "pydantic[email]==2.14.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
expense-tracker = "expense_tracker.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
